default_permissions = "project"

[mcp_servers.vercel]
enabled = true

[permissions.project]
extends = "self"

[permissions.project.workspace_roots]
"~/Projects/dotfiles" = true

# Adding a herdr-* sibling requires updating the native lists here and in
# .claude/settings.json; Pi and OpenCode use supported sibling globs.
[permissions.project.filesystem]
"~/Projects/dotfiles" = "write"
"~/Projects/herdr-agentbox" = "read"
"~/Projects/herdr-focus-notify" = "read"
"~/Projects/herdr-machine0" = "read"
"~/Projects/herdr-menu" = "read"
"~/Projects/herdr-native-notify" = "read"
"~/Projects/herdr-plugins" = "read"
"~/Projects/herdr-repeat-navigation" = "read"
"~/Projects/herdr-web-ui" = "read"
