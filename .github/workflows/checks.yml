name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pi-sidebar/package-lock.json
      - run: npm ci
      # Root integration tests exercise the sidebar's locked Pi 1.4 SDK.
      - run: npm ci --prefix packages/pi-sidebar
      - run: node scripts/test-suite.mjs --full
  components:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/*/package-lock.json
      - run: npm ci
      - run: node scripts/check-components.mjs --shard ${{ matrix.shard }}/4 --install --full
  pressure-macos:
    runs-on: macos-latest
    env:
      PI_PRESSURE_REQUIRE_SWIFT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/pi-pressure/package-lock.json
      - run: npm ci --prefix packages/pi-pressure
      - run: node scripts/check-components.mjs pi-pressure --full
